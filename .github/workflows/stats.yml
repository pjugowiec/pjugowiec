name: Refresh stats

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Accept a >50% drop in total contributions'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip, not the triggering SHA, so a run started right after a push
      # uses the latest script.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test scripts/stats.test.mjs

      - name: Generate stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/stats.mjs $FORCE

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: refresh stats"
          git pull --rebase origin main
          git push

name: Update Contributions Badge
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          RESULT=$(curl -s -H "Authorization: bearer $GH_PAT" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{viewer{contributionsCollection{contributionCalendar{totalContributions}}}}"}' \
            https://api.github.com/graphql)
          TOTAL=$(echo "$RESULT" | jq -r '.data.viewer.contributionsCollection.contributionCalendar.totalContributions')
          mkdir -p .github/badges
          echo "{\"schemaVersion\":1,\"label\":\"Contributions (last year)\",\"message\":\"$TOTAL\",\"color\":\"238636\"}" > .github/badges/contributions.json

      - name: Commit badge
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/badges/contributions.json
          git diff --staged --quiet || git commit -m "chore: update contributions badge"
          git push
